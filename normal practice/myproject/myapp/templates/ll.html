<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My E-Commerce Store</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">MyStore</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Cart</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Checkout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Product Grid -->
  <div class="container my-4">
    <div class="row" id="product-list">
      <!-- Products will be injected here by JS -->
    </div>
  </div>

  <!-- Cart Section -->
  <div class="container my-4">
    <h3>🛒 Cart</h3>
    <ul id="cart" class="list-group"></ul>
  </div>

  <!-- Bootstrap JS + Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Custom JS -->
  <script>
    // Sample products
    const products = [
      {id:1, name:"Product 1", price:499, img:"https://via.placeholder.com/200"},
      {id:2, name:"Product 2", price:799, img:"https://via.placeholder.com/200"},
      {id:3, name:"Product 3", price:999, img:"https://via.placeholder.com/200"}
    ];

    const productList = document.getElementById("product-list");
    const cart = document.getElementById("cart");

    // Render products
    products.forEach(p => {
      const col = document.createElement("div");
      col.className = "col-md-4";
      col.innerHTML = `
        <div class="card mb-4">
          <img src="${p.img}" class="card-img-top" alt="${p.name}">
          <div class="card-body text-center">
            <h5 class="card-title">${p.name}</h5>
            <p class="card-text">₹${p.price}</p>
            <button class="btn btn-primary" onclick="addToCart(${p.id})">Add to Cart</button>
          </div>
        </div>`;
      productList.appendChild(col);
    });

    // Add to cart function
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const item = document.createElement("li");
      item.className = "list-group-item d-flex justify-content-between align-items-center";
      item.innerHTML = `${product.name} - ₹${product.price} 
        <button class="btn btn-sm btn-danger" onclick="removeItem(this)">Remove</button>`;
      cart.appendChild(item);
    }

    // Remove item
    function removeItem(btn) {
      btn.parentElement.remove();
    }
  </script>
</body>
</html>
