<!DOCTYPE html>
<html>
<head>
    <title>Product List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f8f9fa;
        }

        table{
            margin-top:30px;
        }

        img{
            width:100px;
            height:100px;
            object-fit:cover;
        }
    </style>
</head>

<body>

<div class="container">

    <h1 class="text-center mt-4">Product List</h1>

    <div class="text-end mb-3">
        <a href="{% url 'productadd' %}" class="btn btn-primary">
            Add Product
        </a>
    </div>

    <table class="table table-bordered table-striped text-center align-middle">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Image</th>
                <th>Name</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
        </thead>

        <tbody>

            {% for product in products %}

            <tr>
                <td>{{ product.id }}</td>

                <td>
                    {% if product.image %}
                        <img src="media/{{product.image}}" alt="{{product.image}}">
                    {% else %}
                        No Image
                    {% endif %}
                </td>

                <td>{{ product.name }}</td>
                <td>₹{{ product.price }}</td>
                <td>{{ product.quantity }}</td>
            </tr>

            {% empty %}

            <tr>
                <td colspan="5">No products available.</td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
