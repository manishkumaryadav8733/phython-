<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Product</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    form { width: 50%; margin: auto; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }
    button { margin-top: 15px; padding: 10px 15px; background: #28a745; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #218838; }
  </style>
</head>
<body>
  <h2>Add New Product</h2>
  <form action="{% url 'productadd' %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
    
    <label for="name">Product Name:</label>
    <input type="text" id="name" name="name" required>
    
    <label for="price">Price:</label>
    <input type="number" id="price" name="price" step="0.01" required>
    
    <label for="quantity">Quantity:</label>
    <input type="number" id="quantity" name="quantity" min="1" required>
    
    <label for="image">Product Image:</label>   
    <input type="file" id="image" name="image" accept="image/*" required>
    
    <button type="submit">Add Product</button>
  </form>
</body>
</html>
