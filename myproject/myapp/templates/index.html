<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI E-Commerce Store</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#222;
    color:white;
    padding:20px;
    text-align:center;
}

nav{
    background:#444;
    padding:12px;
    text-align:center;
}

nav a{
    color:white;
    text-decoration:none;
    margin:0 15px;
    font-weight:bold;
}

.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    padding:30px;
    gap:20px;
}

.product{
    width:230px;
    background:white;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
    padding:15px;
    text-align:center;
}

.product img{
    width:100%;
    border-radius:10px;
}

button{
    background:#28a745;
    color:white;
    border:none;
    padding:10px 20px;
    margin-top:10px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#218838;
}

/* AI Chat */

#chatButton{
    position:fixed;
    right:20px;
    bottom:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#007bff;
    color:white;
    font-size:28px;
}

#chatBox{
    display:none;
    position:fixed;
    bottom:90px;
    right:20px;
    width:320px;
    background:white;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,.3);
}

#messages{
    height:250px;
    overflow:auto;
    padding:10px;
}

#userInput{
    width:75%;
    padding:10px;
    border:none;
}

#sendBtn{
    width:25%;
    background:#007bff;
    color:white;
    border:none;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:30px;
}
</style>

</head>
<body>

<header>
    <h1>🛍 AI E-Commerce Store</h1>
    <p>Smart Shopping with AI Assistant</p>
</header>

<nav>
    <a href="#">Home</a>
    <a href="{%url 'product'%}">Products</a>
    <a href="{%url 'cart'%}">Cart</a>
    <a href="{%url 'contact'%}">Contact</a>
</nav>


<!-- AI Button -->

<button id="chatButton">🤖</button>

<div id="chatBox">

<div id="messages">
<b>AI:</b> Hello! How can I help you today?<br><br>
</div>

<div style="display:flex;">
<input id="userInput" placeholder="Ask AI...">
<button id="sendBtn">Send</button>
</div>

</div>

<footer>
© 2026 AI E-Commerce Store
</footer>

<script>

const chatButton=document.getElementById("chatButton");
const chatBox=document.getElementById("chatBox");

chatButton.onclick=()=>{
chatBox.style.display=
chatBox.style.display=="block"?"none":"block";
}

document.getElementById("sendBtn").onclick=function(){

let input=document.getElementById("userInput");

let msg=input.value.trim();

if(msg=="") return;

let messages=document.getElementById("messages");

messages.innerHTML+="<b>You:</b> "+msg+"<br>";

/* Temporary AI Reply */

let reply="I'm your AI Shopping Assistant. Soon I'll connect with OpenAI API.";

messages.innerHTML+="<b>AI:</b> "+reply+"<br><br>";

messages.scrollTop=messages.scrollHeight;

input.value="";

}

</script>

</body>
</html>
